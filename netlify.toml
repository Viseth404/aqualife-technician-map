# Netlify settings: how to build, and security headers for every page.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers (protect admins' browsers).
[[headers]]
  for = "/*"
  [headers.values]
    # Only load code and data from the places this app really uses:
    #   Supabase (database + login + live updates), Photon (address search),
    #   OSRM (driving distance), OpenStreetMap (map tiles), Google Fonts.
    # Technician photos can come from any https link, so img-src allows https:.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://photon.komoot.io https://router.project-osrm.org https://fonts.googleapis.com https://fonts.gstatic.com https://tile.openstreetmap.org;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      object-src 'none'
    """
    # Don't let other websites show this app inside a frame (click-jacking).
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # GPS only for this site ("My location" on the phone screen); no camera, mic, or payments.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Built files have unique names, so browsers can cache them for a long time.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PWA: the app's "service worker" and manifest must always be checked for updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
